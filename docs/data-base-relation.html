<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Relation</title>
<meta name="description" content="แผนผังความสัมพันธ์ของฐานข้อมูล Prisma ทั้งหมด พร้อมคำอธิบายว่าแต่ละตารางใช้ทำอะไร และรายละเอียดทุก field">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#eef0f3;--ink:#16202a;--muted:#566370;--faint:#8793a0;
  --line:#d6dbe1;--edge:#7d8a97;--accent:#1f5fd6;--accent-soft:#e2ebfb;--warn:#b45309;
  --g-id:#475569;--g-chan:#be185d;--g-line:#1f5fd6;--g-redis:#b91c1c;--g-prod:#7c3aed;--g-know:#0f766e;--g-bill:#b45309;--g-log:#0369a1;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--surface:#161b22;--surface-2:#1d232c;--ink:#e5e9ee;--muted:#9aa5b1;--faint:#6d7884;
  --line:#2b333d;--edge:#6d7a87;--accent:#6ea2ff;--accent-soft:#1a2a45;--warn:#f59e0b;
  --g-id:#94a3b8;--g-chan:#f472b6;--g-line:#6ea2ff;--g-redis:#f87171;--g-prod:#a78bfa;--g-know:#2dd4bf;--g-bill:#f59e0b;--g-log:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#161b22;--surface-2:#1d232c;--ink:#e5e9ee;--muted:#9aa5b1;--faint:#6d7884;
  --line:#2b333d;--edge:#6d7a87;--accent:#6ea2ff;--accent-soft:#1a2a45;--warn:#f59e0b;
  --g-id:#94a3b8;--g-chan:#f472b6;--g-line:#6ea2ff;--g-redis:#f87171;--g-prod:#a78bfa;--g-know:#2dd4bf;--g-bill:#f59e0b;--g-log:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);display:flex;flex-direction:column;min-height:100vh}
button,input{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.9em}
header.top{display:flex;align-items:center;gap:12px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:17px;font-weight:600;margin:0}
header.top .meta{color:var(--muted);font-size:12.5px;flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.btn:hover{color:var(--ink);border-color:var(--edge)}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:220px;font-size:13px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
nav.tabs{display:flex;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
nav.tabs button.tab{border:1px solid transparent;background:none;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13.5px}
nav.tabs button.tab:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:600}
.sep{flex:1}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.chip{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 460px;height:calc(100vh - 140px)}
#stage{position:relative;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gframe{position:absolute;border:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:14px;background:color-mix(in srgb,var(--c) 5%,transparent)}
.gframe .gt{position:absolute;left:16px;top:8px;font-weight:600;color:var(--c);font-size:15px}
.gframe .gt small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
.card{position:absolute;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:9px;padding:7px 10px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:opacity .15s,box-shadow .15s,border-color .15s}
.card:hover{border-color:var(--c)}
.card.sel{box-shadow:0 0 0 2.5px var(--c),var(--shadow)}
.card.dim{opacity:.18}
.card .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t{color:var(--faint);font-family:var(--mono);font-size:10.5px}
.card .p{color:var(--muted);font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .f{position:absolute;right:8px;top:7px;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.card.hub .n::after{content:" ★";color:var(--warn)}
.eg path.l{fill:none;stroke:var(--edge);stroke-width:1.4;transition:opacity .15s}
.eg .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:help}
.eg .mk{fill:var(--edge)}
.eg.company path.l,.eg.company .mk{opacity:.5}
.eg.soft path.l{stroke-dasharray:5 4}
.eg.dim path.l,.eg.dim .mk{opacity:.05}
.eg.hi path.l{stroke:var(--accent);stroke-width:2.4;opacity:1}
.eg.hi .mk{fill:var(--accent);opacity:1}
.eg.hide{display:none}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:7px;font-size:12px;max-width:420px;display:none;font-family:var(--mono)}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:5}
.hint{position:absolute;right:12px;bottom:12px;color:var(--faint);font-size:11.5px;background:color-mix(in srgb,var(--surface) 85%,transparent);padding:3px 8px;border-radius:6px;z-index:5}
aside#panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px 18px 60px}
aside#panel .empty{color:var(--muted);padding:30px 6px}
.ph{border-left:6px solid var(--c);padding-left:12px;margin-bottom:12px}
.ph h2{margin:0;font-size:20px}
.ph .sub{color:var(--muted);font-size:12.5px}
.ph .gb{display:inline-block;font-size:11.5px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:0 8px;margin-top:4px}
.x{float:right}
h3{font-size:13px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.use{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.use b{display:block;margin-bottom:3px}
.use span{color:var(--muted)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;word-break:break-all}
ul.rels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
ul.rels li{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:var(--surface-2)}
ul.rels a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
ul.rels a:hover{text-decoration:underline}
.card-n{font-size:11px;color:var(--faint);font-family:var(--mono)}
.fields{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fr{padding:7px 10px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:2px 10px}
.fr:first-child{border-top:0}
.fr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.fr .fn{font-family:var(--mono);font-weight:600;font-size:12.5px;word-break:break-all}
.fr .ft{font-family:var(--mono);color:var(--code-key,#0b5cad);font-size:11.5px}
.fr .fd{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.fr .fd i{color:var(--faint);font-style:normal}
.b{display:inline-block;font-family:var(--mono);font-size:10px;padding:0 5px;border-radius:5px;margin:0 3px 0 0;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.b.pk{background:#fde68a;color:#78350f;border-color:#f5d36b}
.b.fk{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}
.b.uq{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
.b.en{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.pk{background:#4b3a07;color:#fcd34d;border-color:#6b5410}:root:not([data-theme="light"]) .b.uq{background:#06382a;color:#6ee7b7;border-color:#0d5b43}:root:not([data-theme="light"]) .b.en{background:#2a1f55;color:#c4b5fd;border-color:#3e2f7d}}
:root[data-theme="dark"] .b.pk{background:#4b3a07;color:#fcd34d;border-color:#6b5410}
:root[data-theme="dark"] .b.uq{background:#06382a;color:#6ee7b7;border-color:#0d5b43}
:root[data-theme="dark"] .b.en{background:#2a1f55;color:#c4b5fd;border-color:#3e2f7d}
.enumvals{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.enumvals span{font-family:var(--mono);font-size:10.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 5px}
pre.cons{margin:0;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
/* list + enum views */
#alt{display:none;overflow:auto;padding:16px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.lc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:9px;padding:9px 12px;cursor:pointer;box-shadow:var(--shadow)}
.lc:hover{border-color:var(--c)}
.lc.sel{box-shadow:0 0 0 2.5px var(--c)}
.lc .n{font-weight:600} .lc .t{font-family:var(--mono);font-size:11px;color:var(--faint)}
.lc .p{color:var(--muted);font-size:12.5px;margin-top:2px}
.lc .m{color:var(--faint);font-size:11.5px;font-family:var(--mono);margin-top:3px}
.sec{margin:6px 0 10px;font-weight:600;color:var(--c)}
body[data-view="list"] #stage,body[data-view="enum"] #stage{display:none}
body[data-view="list"] #alt,body[data-view="enum"] #alt{display:block}
body[data-view="diagram"] .legend-only-diagram{display:flex}
@media (max-width:980px){
  main{grid-template-columns:1fr}
  aside#panel{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:20;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.25);display:none}
  body.has-sel aside#panel{display:block}
  .hint{display:none}
}
</style>

const CW=236,CH=96,GX=18,GY=18,PAD=18,TITLE=38,GGAP=70,CGAP=90;

/* ---------- layout ---------- */
function layout(){
  const cols={};
  D.groups.forEach(g=>{(cols[g.col]??=[]).push(g)});
  const colX={};let x=0;
  Object.keys(cols).sort((a,b)=>a-b).forEach(c=>{
    const w=Math.max(...cols[c].map(g=>g.cols*CW+(g.cols-1)*GX+2*PAD));
    colX[c]=x;cols[c].forEach(g=>g.w=w);x+=w+CGAP;
  });
  D.groups.forEach(g=>{g.rows=Math.ceil(g.models.length/g.cols);g.h=TITLE+g.rows*CH+(g.rows-1)*GY+PAD});
  Object.keys(cols).forEach(c=>{
    let y=0;
    cols[c].sort((a,b)=>a.row-b.row).forEach(g=>{
      g.x=colX[c];g.y=y;y+=g.h+GGAP;
      g.models.forEach((m,i)=>{
        pos[m]={x:g.x+PAD+(i%g.cols)*(CW+GX),y:g.y+TITLE+Math.floor(i/g.cols)*(CH+GY),w:CW,h:CH};
      });
    });
  });
  D.W=x-CGAP;D.H=Math.max(...Object.values(cols).map(a=>a[a.length-1].y+a[a.length-1].h));
}
function incount(n){return D.edges.filter(e=>e.to===n).length}

/* ---------- edges ---------- */
const NORM={r:[1,0],l:[-1,0],t:[0,-1],b:[0,1]};
function sideTo(a,b){
  const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
  const dx=bx-ax,dy=by-ay;
  if(Math.abs(dx)/(a.w/2+b.w/2+GX)>Math.abs(dy)/(a.h/2+b.h/2+GY)) return dx>0?'r':'l';
  return dy>0?'b':'t';
}
function buildEdges(){
  const svg=$('#edges');svg.setAttribute('width',D.W);svg.setAttribute('height',D.H);
  svg.setAttribute('viewBox',`0 0 ${D.W} ${D.H}`);
  const all=[];
  D.edges.forEach(e=>all.push({kind:'fk',from:e.from,to:e.to,e}));
  D.soft.forEach(s=>all.push({kind:'soft',from:s.from,to:s.to,e:s}));
  // assign sides, then spread anchors along each side
  const slots={};
  all.forEach(x=>{
    x.sa=sideTo(pos[x.from],pos[x.to]);x.sb=sideTo(pos[x.to],pos[x.from]);
    (slots[x.from+'|'+x.sa]??=[]).push({x,end:'a'});
    (slots[x.to+'|'+x.sb]??=[]).push({x,end:'b'});
  });
  Object.entries(slots).forEach(([k,arr])=>{
    const [m,side]=k.split('|');const p=pos[m];
    arr.sort((u,v)=>{
      const o=t=>{const q=pos[t.end==='a'?t.x.to:t.x.from];return (side==='l'||side==='r')?q.y:q.x};
      return o(u)-o(v)||(u.x.kind<v.x.kind?-1:1);
    });
    arr.forEach((t,i)=>{
      const f=(i+1)/(arr.length+1);
      const pt=(side==='r')?[p.x+p.w,p.y+p.h*f]:(side==='l')?[p.x,p.y+p.h*f]:(side==='t')?[p.x+p.w*f,p.y]:[p.x+p.w*f,p.y+p.h];
      t.x['p'+t.end]=pt;
    });
  });
  all.forEach(x=>{
    const [x0,y0]=x.pa,[x1,y1]=x.pb;const n0=NORM[x.sa],n1=NORM[x.sb];
    const d=Math.max(50,Math.hypot(x1-x0,y1-y0)*.32);
    const path=`M${x0},${y0} C${x0+n0[0]*d},${y0+n0[1]*d} ${x1+n1[0]*d},${y1+n1[1]*d} ${x1},${y1}`;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','eg '+(x.kind==='soft'?'soft ':'')+((x.to==='Company'||x.from==='Company')?'company':''));
    const nsPath=(c)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);p.setAttribute('class',c);return p};
    g.appendChild(nsPath('l'));
    // parent end: arrow, child end: dot
    const ang=Math.atan2(-n1[1],-n1[0]);// direction pointing into the card
    const ar=document.createElementNS('http://www.w3.org/2000/svg','path');
    const s=7;const ax=x1,ay=y1;const ux=-n1[0],uy=-n1[1];  // points into card from outside: move along -normal
    const bx=ax+n1[0]*s*1.6,by=ay+n1[1]*s*1.6;const px=-n1[1]*s*.7,py=n1[0]*s*.7;
    ar.setAttribute('d',`M${ax},${ay} L${bx+px},${by+py} L${bx-px},${by-py} Z`);ar.setAttribute('class','mk');
    g.appendChild(ar);
    if(x.kind==='fk'){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x0+n0[0]*4);c.setAttribute('cy',y0+n0[1]*4);c.setAttribute('r',3.6);c.setAttribute('class','mk');g.appendChild(c)}
    const h=nsPath('hit');g.appendChild(h);
    const txt=x.kind==='fk'
      ? x.e.items.map(i=>`${x.from}.${i.fk.join('+')} → ${x.to}.${i.refs.join('+')}  (${i.one?'1:1':'N:1'}${i.optional?', optional':''}${i.onDelete?', onDelete '+i.onDelete:''})`).join('\n')
      : `${x.from}.${x.e.field} ⇢ ${x.to}  (ไม่มี FK${x.e.note?' · '+x.e.note:''})`;
    h.addEventListener('mousemove',ev=>tip(txt,ev));h.addEventListener('mouseleave',()=>tip(null));
    h.style.pointerEvents='stroke';
    h.addEventListener('click',ev=>{ev.stopPropagation();select(x.from)});
    svg.appendChild(g);x.el=g;edgeEls.push(x);
  });
}
function tip(t,ev){const el=$('#tip');if(!t){el.style.display='none';return}el.style.display='block';el.style.whiteSpace='pre';el.textContent=t;el.style.left=Math.min(ev.clientX+14,innerWidth-el.offsetWidth-8)+'px';el.style.top=(ev.clientY+14)+'px'}

function related(n){const s=new Set([n]);D.edges.forEach(e=>{if(e.from===n)s.add(e.to);if(e.to===n)s.add(e.from)});D.soft.forEach(e=>{if(e.from===n)s.add(e.to);if(e.to===n)s.add(e.from)});return s}
function hover(n){applyHighlight(n||state.sel)}
function applyHighlight(focus){
  const hasQ=!!matchSet;
  edgeEls.forEach(x=>{
    const g=x.el;
    g.classList.toggle('hide',x.kind==='soft'?!state.soft:((x.from==='Company'||x.to==='Company')&&!state.company));
    const on=focus&&(x.from===focus||x.to===focus);
    g.classList.toggle('hi',!!on);g.classList.toggle('dim',!!focus&&!on);
  });
  const rel=focus?related(focus):null;
  document.querySelectorAll('.card').forEach(c=>{
    const n=c.dataset.m;
    let dim=false;
    if(rel&&!rel.has(n))dim=true;
    if(!focus&&state.group&&M[n].group!==state.group)dim=true;
    if(hasQ&&!matchSet.has(n))dim=true;
    c.classList.toggle('dim',dim);c.classList.toggle('sel',n===state.sel);
  });
}

function badgeHtml(f){
  let h='';
  if(f.badges.includes('PK'))h+='<span class="b pk">PK</span>';
  if(f.fk)h+=f.fk.map(t=>`<span class="b fk" data-go="${esc(t)}" title="FK → ${esc(t)}">FK→${esc(t)}</span>`).join('');
  if(f.badges.includes('UQ'))h+='<span class="b uq">UNIQUE</span>';
  if(f.enum)h+='<span class="b en">enum</span>';
  if(f.badges.includes('null'))h+='<span class="b">nullable</span>';
  if(f.updatedAt)h+='<span class="b">auto</span>';
  return h;
}
function fieldRow(f){
  const en=f.enum&&D.enums[f.base]?`<div class="enumvals">${D.enums[f.base].values.map(v=>`<span>${esc(v.name)}</span>`).join('')}</div>`:'';
  const meta=[f.db?`@db.${f.db}`:null,f.default!=null?`default ${f.default}`:null].filter(Boolean).join(' · ');
  const note=f.note||'';
  const doc=f.doc&&f.doc!==note?`<br><i>schema: ${esc(f.doc)}</i>`:'';
  return `<div class="fr"><div class="fn">${esc(f.name)}</div><div><span class="ft">${esc(f.type)}</span> ${badgeHtml(f)}${meta?`<div class="card-n">${esc(meta)}</div>`:''}</div>
    <div class="fd">${esc(note)}${doc}${en}</div></div>`;
}

  const p=$('#panel');const m=M[state.sel];
  document.body.classList.toggle('has-sel',!!m);
  if(!m){p.innerHTML='<div class="empty"><b>เลือกตารางเพื่อดูรายละเอียด</b><br>คลิกการ์ดในแผนภาพ หรือรายการด้านซ้าย จะเห็นว่าตารางนี้ใช้ทำอะไร มี field อะไรบ้าง และเชื่อมกับตารางไหน<br><br>★ Company คือศูนย์กลาง ทุกข้อมูลของลูกค้าร้านค้าผูกกับ Company ผ่าน companyId</div>';return}
  const out=D.edges.filter(e=>e.from===m.name),inn=D.edges.filter(e=>e.to===m.name);
  const sOut=D.soft.filter(s=>s.from===m.name),sIn=D.soft.filter(s=>s.to===m.name);
  const link=n=>`<a data-go="${esc(n)}">${esc(n)}</a>`;
  const relOut=out.map(e=>`<li>${link(e.to)}<div class="card-n">${e.items.map(i=>`${esc(m.name)}.${esc(i.fk.join('+'))} → ${esc(e.to)}.${esc(i.refs.join('+'))} · ${i.one?'1:1':'N:1'}${i.optional?' · optional':''}${i.onDelete?' · onDelete '+esc(i.onDelete):''}`).join('<br>')}</div></li>`).join('');
  const relIn=inn.map(e=>`<li>${link(e.from)}<div class="card-n">${e.items.map(i=>`${esc(e.from)}.${esc(i.fk.join('+'))} → ${esc(m.name)}.${esc(i.refs.join('+'))} · ${i.one?'1:1':'1:N'}`).join('<br>')}</div></li>`).join('');
  const softOut=sOut.map(s=>`<li>${link(s.to)}<div class="card-n">${esc(m.name)}.${esc(s.field)} ⇢ ${esc(s.to)} (ไม่มี FK)${s.note?' · '+esc(s.note):''}</div></li>`).join('');
  const softIn=sIn.map(s=>`<li>${link(s.from)}<div class="card-n">${esc(s.from)}.${esc(s.field)} ⇢ ${esc(m.name)} (ไม่มี FK)${s.note?' · '+esc(s.note):''}</div></li>`).join('');
  const cols=m.fields.filter(f=>!f.rel);
  const rels=m.fields.filter(f=>f.rel);
  const showRel=p.dataset.showrel==='1';
  p.style.setProperty('--c',gcol(m.group));
  p.innerHTML=`<button class="btn x" id="pclose" type="button">ปิด</button>
  <div class="ph" style="--c:${gcol(m.group)}"><h2>${esc(m.name)}</h2><div class="sub mono">${esc(m.table)}</div><span class="gb">${esc(GR[m.group].label)}</span></div>
  <div class="use"><b>${esc(m.purpose)}</b><span>${esc(m.detail)}</span></div>
  ${m.doc?`<div class="card-n" style="margin-top:6px">schema: ${esc(m.doc)}</div>`:''}
  <h3>ข้อมูลตาราง</h3>
  <dl class="kv"><dt>ชื่อใน DB</dt><dd class="mono">${esc(m.table)}</dd><dt>ไฟล์</dt><dd class="mono">prisma/${esc(m.file)}</dd><dt>คอลัมน์</dt><dd>${cols.length} คอลัมน์ · FK ออก ${out.length} · ถูกอ้าง ${inn.length}</dd></dl>
  <h3>อ้างถึงตารางอื่น (มี FK) — ${out.length}</h3>${out.length?`<ul class="rels">${relOut}</ul>`:'<div class="card-n">ไม่มี</div>'}
  <h3>ถูกตารางอื่นอ้างถึง — ${inn.length}</h3>${inn.length?`<ul class="rels">${relIn}</ul>`:'<div class="card-n">ไม่มี</div>'}
  ${(sOut.length||sIn.length)?`<h3>อ้างอิงแบบหลวม (ไม่มี FK)</h3><ul class="rels">${softOut}${softIn}</ul>`:''}
  <h3>Fields (${cols.length})</h3>
  <div class="fields">${cols.map(fieldRow).join('')}</div>
  ${rels.length?`<h3>Relation fields ใน Prisma (${rels.length})</h3><div class="card-n">${rels.map(r=>`<span class="mono">${esc(r.name)}</span>: ${esc(r.type)}${r.relinfo&&r.relinfo.fk?' (เป็นเจ้าของ FK)':''}`).join('<br>')}</div>`:''}
  ${m.constraints.length?`<h3>Index / Unique</h3><pre class="cons">${esc(m.constraints.join('\n'))}</pre>`:''}`;
  $('#pclose').onclick=()=>select(null);
  p.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>select(a.dataset.go,true)));
}

/* ---------- views ---------- */
let matchSet=null;
function computeMatch(){
  const q=state.q.trim().toLowerCase();
  if(!q){matchSet=null;return}
  matchSet=new Set(Object.values(M).filter(m=>
    [m.name,m.table,m.purpose,m.detail,...m.fields.map(f=>f.name+' '+(f.note||''))].join(' ').toLowerCase().includes(q)).map(m=>m.name));
}
function renderList(){
  const alt=$('#alt');
  if(state.view==='list'){
    alt.innerHTML=D.groups.map(g=>{
      const ms=g.models.filter(n=>!matchSet||matchSet.has(n));
      if(!ms.length)return '';
      return `<div class="sec" style="--c:${gcol(g.id)}">${esc(g.label)} <small style="color:var(--faint);font-weight:400">${ms.length}</small></div><div class="grid" style="margin-bottom:18px">${ms.map(n=>{const m=M[n];
        return `<div class="lc ${state.sel===n?'sel':''}" style="--c:${gcol(g.id)}" data-m="${esc(n)}"><div class="n">${esc(n)}</div><div class="t">${esc(m.table)}</div><div class="p">${esc(m.purpose)}</div><div class="m">${m.cols} คอลัมน์ · FK ออก ${outcount(n)} · ถูกอ้าง ${incount(n)}</div></div>`}).join('')}</div>`}).join('')||'<div class="empty">ไม่พบ</div>';
    alt.querySelectorAll('.lc').forEach(el=>el.addEventListener('click',()=>select(el.dataset.m)));
  }else if(state.view==='enum'){
    const q=state.q.trim().toLowerCase();
    const names=Object.keys(D.enums).filter(n=>!q||(n+' '+D.enums[n].values.map(v=>v.name).join(' ')).toLowerCase().includes(q));
    alt.innerHTML=`<div class="grid">${names.map(n=>{const e=D.enums[n];return `<div class="lc" style="--c:var(--accent);cursor:default"><div class="n">${esc(n)}</div>${e.doc?`<div class="p">${esc(e.doc)}</div>`:''}<div class="enumvals" style="margin-top:6px">${e.values.map(v=>`<span title="${esc(v.doc||'')}">${esc(v.name)}${v.map&&v.map!==v.name?` = "${esc(v.map)}"`:''}</span>`).join('')}</div>
      <div class="m">ใช้ใน: ${e.used.length?e.used.map(u=>`<a data-go="${esc(u.split('.')[0])}" style="color:var(--accent);cursor:pointer">${esc(u)}</a>`).join(', '):'—'}</div></div>`}).join('')}</div>`;
    alt.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>select(a.dataset.go,true)));
  }
}
function setView(v){
  state.view=v;document.body.dataset.view=v;
  document.querySelectorAll('nav.tabs .tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  refresh();if(v==='diagram')requestAnimationFrame(()=>{if(!window.__fitted){fit();window.__fitted=1}});
}
function select(n,center){
  state.sel=n&&M[n]?n:null;
  renderPanel();refresh();
  if(state.sel&&center&&state.view==='diagram')focusOn(state.sel);
}
function refresh(){computeMatch();applyHighlight(state.sel);if(state.view!=='diagram')renderList()}

/* ---------- pan / zoom ---------- */
function applyT(){state.touched=state.touched||window.__booted;$('#world').style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.k})`}
function fit(){
  const s=$('#stage');const pw=s.clientWidth,ph=s.clientHeight;
  const k=Math.min(pw/(D.W+40),ph/(D.H+40));
  state.k=Math.max(.12,Math.min(1,k));state.tx=(pw-D.W*state.k)/2;state.ty=(ph-D.H*state.k)/2;applyT();
}
function zoomAt(f,cx,cy){
  const k0=state.k,k1=Math.max(.12,Math.min(2.2,k0*f));
  state.tx=cx-(cx-state.tx)*(k1/k0);state.ty=cy-(cy-state.ty)*(k1/k0);state.k=k1;applyT();
}
function focusOn(n){
  const p=pos[n],s=$('#stage');
  const k=Math.max(state.k,.7);state.k=k;
  state.tx=s.clientWidth/2-(p.x+p.w/2)*k;state.ty=s.clientHeight/2-(p.y+p.h/2)*k;
  const w=$('#world');w.style.transition='transform .35s ease';applyT();setTimeout(()=>w.style.transition='',380);
}
function initStage(){
  const s=$('#stage');let drag=null,moved=false;
  s.addEventListener('pointerdown',e=>{if(e.target.closest('.card,.zoom,.hit'))return;drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};moved=false;s.setPointerCapture(e.pointerId);s.classList.add('drag')});
  s.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;state.tx=drag.tx+dx;state.ty=drag.ty+dy;applyT()});
  const end=()=>{drag=null;s.classList.remove('drag')};
  s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);
  s.addEventListener('click',e=>{if(!moved&&!e.target.closest('.card,.zoom'))select(null)});
  s.addEventListener('wheel',e=>{e.preventDefault();const r=s.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  $('#zin').onclick=()=>zoomAt(1.25,s.clientWidth/2,s.clientHeight/2);
  $('#zout').onclick=()=>zoomAt(.8,s.clientWidth/2,s.clientHeight/2);
  $('#zfit').onclick=fit;
  addEventListener('resize',()=>{if(state.view==='diagram'&&!state.touched)fit()});
}

/* ---------- boot ---------- */
function boot(){
  layout();buildWorld();buildEdges();initStage();
  $('#legend').innerHTML=D.groups.map(g=>`<button type="button" class="chip" style="--c:${gcol(g.id)}" data-g="${g.id}" aria-pressed="false">${esc(g.label)} · ${g.models.length}</button>`).join('');
  $('#legend').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    state.group=state.group===b.dataset.g?null:b.dataset.g;
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.g===state.group));
    refresh();
  });
  document.querySelectorAll('nav.tabs .tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  $('#optCompany').onchange=e=>{state.company=e.target.checked;refresh()};
  $('#optSoft').onchange=e=>{state.soft=e.target.checked;refresh()};
  $('#q').addEventListener('input',e=>{state.q=e.target.value;refresh()});
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&matchSet&&matchSet.size){select([...matchSet][0],true)}});
  $('#theme').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1116';r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('dbrel-theme',r.dataset.theme)}catch(_){}};
  try{const t=localStorage.getItem('dbrel-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null);if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}});
  const hash=decodeURIComponent(location.hash.slice(1));
  fit();window.__fitted=1;
  if(M[hash])select(hash,true);else renderPanel();
  applyHighlight(state.sel);window.__booted=1;
  const v=new URLSearchParams(location.search).get('view');if(v==='list'||v==='enum')setView(v);
}
boot();
</script>
</body>
</html>
