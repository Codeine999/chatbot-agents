<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Flow</title>
<meta name="description" content="แผนผัง end-to-end ของ feature product: preset/meta, admin เขียนสินค้า, สต็อก, index/embedding, แชต Product RAG พร้อม data shape แต่ละขั้น และ ERD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface-2:#eef0f3;--ink:#16202a;--muted:#566370;--faint:#8793a0;
  --line:#d6dbe1;--edge:#97a3af;--accent:#1f5fd6;--accent-ink:#ffffff;--accent-soft:#e2ebfb;
  --k-svc:#5b6876;--k-dec:#b45309;--k-llm:#7c3aed;--k-ext:#0e7490;--k-start:#1f5fd6;
  --o-reply:#15803d;--o-handoff:#c2410c;--o-silent:#6b7280;--o-error:#b91c1c;--o-ask:#2563eb;
  --g-line:#1f5fd6;--g-know:#0f766e;--g-prod:#7c3aed;--g-bill:#b45309;--g-id:#475569;--g-redis:#b91c1c;
  --code-bg:#f6f7f9;--code-key:#0b5cad;--code-str:#1d7a3a;--code-com:#8a8f98;--code-num:#a2420d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--surface:#161b22;--surface-2:#1d232c;--ink:#e5e9ee;--muted:#9aa5b1;--faint:#6d7884;
  --line:#2b333d;--edge:#5d6873;--accent:#6ea2ff;--accent-ink:#0b1220;--accent-soft:#1a2a45;
  --k-svc:#8b98a6;--k-dec:#f59e0b;--k-llm:#a78bfa;--k-ext:#22b8cf;--k-start:#6ea2ff;
  --o-reply:#34c46b;--o-handoff:#fb923c;--o-silent:#8b94a0;--o-error:#f87171;--o-ask:#60a5fa;
  --g-line:#6ea2ff;--g-know:#2dd4bf;--g-prod:#a78bfa;--g-bill:#f59e0b;--g-id:#94a3b8;--g-redis:#f87171;
  --code-bg:#11161d;--code-key:#79b8ff;--code-str:#85e89d;--code-com:#6a737d;--code-num:#ffab70;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#161b22;--surface-2:#1d232c;--ink:#e5e9ee;--muted:#9aa5b1;--faint:#6d7884;
  --line:#2b333d;--edge:#5d6873;--accent:#6ea2ff;--accent-ink:#0b1220;--accent-soft:#1a2a45;
  --k-svc:#8b98a6;--k-dec:#f59e0b;--k-llm:#a78bfa;--k-ext:#22b8cf;--k-start:#6ea2ff;
  --o-reply:#34c46b;--o-handoff:#fb923c;--o-silent:#8b94a0;--o-error:#f87171;--o-ask:#60a5fa;
  --g-line:#6ea2ff;--g-know:#2dd4bf;--g-prod:#a78bfa;--g-bill:#f59e0b;--g-id:#94a3b8;--g-redis:#f87171;
  --code-bg:#11161d;--code-key:#79b8ff;--code-str:#85e89d;--code-com:#6a737d;--code-num:#ffab70;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
header.top .meta{color:var(--muted);font-size:12.5px;flex:1;min-width:220px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--edge)}
nav.views{display:flex;gap:6px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav.views button{border:1px solid transparent;background:none;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:13.5px}
nav.views button:hover{background:var(--surface-2);color:var(--ink)}
nav.views button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:600}
nav.views .num{font-family:var(--mono);font-size:11px;opacity:.7;margin-right:4px}
main#app{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 420px;height:calc(100vh - 100px)}
aside#events{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:12px 10px 40px}
aside#panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px 60px}
section#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#stage svg.dragging{cursor:grabbing}
.toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.toolbar button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;box-shadow:var(--shadow);font-size:12.5px}
.toolbar button:hover{border-color:var(--edge)}
.legend{position:absolute;bottom:10px;left:10px;z-index:2;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;top:10px;right:10px;z-index:2;font-size:11.5px;color:var(--faint);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:3px 8px;border-radius:6px}
/* event list */
.evgroup{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:14px 6px 6px;font-weight:600}
.evgroup:first-child{margin-top:2px}
.ev{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;cursor:pointer;margin-bottom:2px}
.ev:hover{background:var(--surface-2)}
.ev[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.ev .t{display:flex;gap:7px;align-items:baseline;font-size:13px;line-height:1.35}
.ev .t b{font-weight:500}
.ev .x{display:block;color:var(--muted);font-size:11.5px;margin-left:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.o-reply{--oc:var(--o-reply)}.o-handoff{--oc:var(--o-handoff)}.o-silent{--oc:var(--o-silent)}.o-error{--oc:var(--o-error)}.o-ask{--oc:var(--o-ask)}.o-pass{--oc:var(--accent)}
.dot{background:var(--oc,var(--faint))}
.evsearch{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;margin-bottom:6px}
/* svg graph */
.gedge path.e{fill:none;stroke:var(--edge);stroke-width:1.4;opacity:.75;transition:opacity .15s}
.gedge path.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.gedge.soft path.e{stroke-dasharray:4 4}
.elabel{font:500 10.5px var(--font);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
svg.has-ev .gedge:not(.hot) path.e{opacity:.1}
svg.has-ev .gedge:not(.hot) .elabel{opacity:.12}
svg.has-adj:not(.has-ev) .gedge:not(.adj) path.e{opacity:.18}
svg.has-adj:not(.has-ev) .gedge:not(.adj) .elabel{opacity:.15}
.gedge.adj path.e{stroke:var(--accent);opacity:.9;stroke-width:2}
.gedge.hot path.e{stroke:var(--accent);stroke-width:2.8;opacity:1;stroke-dasharray:8 5;animation:flow .9s linear infinite}
.gedge.hot .elabel{fill:var(--accent);font-weight:600}
@keyframes flow{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.gedge.hot path.e{animation:none;stroke-dasharray:none}}
.gnode{cursor:pointer;transition:opacity .15s}
svg.has-ev .gnode:not(.on){opacity:.22}
svg.has-adj:not(.has-ev) .gnode:not(.adjn){opacity:.35}
.node{width:100%;height:100%;border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:9px;background:var(--surface);padding:5px 8px 5px 8px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.node .nt{font-weight:600;font-size:12px;line-height:1.25;color:var(--ink);word-break:break-word}
.node .ns{color:var(--muted);font-size:10.5px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .tag~.nt{padding-right:30px}
.node .tag{position:absolute;top:4px;right:5px;font:600 8.5px var(--mono);letter-spacing:.4px;color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent);border-radius:4px;padding:0 3px;background:var(--surface)}
.k-svc{--kc:var(--k-svc)}.k-dec{--kc:var(--k-dec)}.k-llm{--kc:var(--k-llm)}.k-ext{--kc:var(--k-ext)}.k-start{--kc:var(--k-start)}
.k-end .node,.node.k-end{border-left-width:1px;border-radius:26px;background:color-mix(in srgb,var(--oc) 9%,var(--surface));border-color:color-mix(in srgb,var(--oc) 45%,var(--line));text-align:center;padding:6px 12px}
.node.k-end .nt{color:color-mix(in srgb,var(--oc) 75%,var(--ink))}
.node.k-start{background:color-mix(in srgb,var(--k-start) 8%,var(--surface))}
.node.k-dec{background:linear-gradient(90deg,color-mix(in srgb,var(--k-dec) 7%,var(--surface)),var(--surface) 60%)}
.node.bus{border-left-width:1px;border-style:dashed;text-align:center;background:var(--surface-2)}
.gnode.sel .node{box-shadow:0 0 0 3px var(--accent)}
.gnode.on .node{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.stepb circle{fill:var(--accent)}
.stepb text{font:700 10px var(--mono);fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central}
/* panel */
#panel h2{font-size:16px;margin:0 0 4px;font-weight:600;line-height:1.35}
#panel h3{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin:18px 0 6px;font-weight:600}
#panel p{margin:6px 0}
#panel .sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.k{color:var(--kc);border-color:color-mix(in srgb,var(--kc) 40%,transparent)}
.chip.o{color:var(--oc);border-color:color-mix(in srgb,var(--oc) 40%,transparent)}
.chip.btn{cursor:pointer}
.chip.btn:hover{border-color:var(--accent);color:var(--accent)}
.example{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;border-left:3px solid var(--accent);margin:8px 0}
.note{font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--k-dec) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--k-dec) 25%,var(--line));border-radius:8px;padding:7px 10px;margin:8px 0}
.note.risk{background:color-mix(in srgb,var(--o-error) 7%,var(--surface));border-color:color-mix(in srgb,var(--o-error) 30%,var(--line))}
ol.steps{list-style:none;padding:0;margin:6px 0;counter-reset:s}
ol.steps li{position:relative;padding:5px 6px 5px 30px;border-radius:7px;cursor:pointer;font-size:13px;counter-increment:s}
ol.steps li::before{content:counter(s);position:absolute;left:4px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 10.5px/20px var(--mono);text-align:center}
ol.steps li:hover{background:var(--surface-2)}
ol.steps li.cur{background:var(--accent-soft)}
ol.steps li .via{display:block;color:var(--faint);font-size:11.5px}
.io{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}
.io .h{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 10px;background:var(--surface-2);font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.io .h b{color:var(--ink);font-weight:600}
pre.code{margin:0;padding:9px 11px;background:var(--code-bg);font:11.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink);max-height:340px;overflow:auto}
pre.code .ck{color:var(--code-key)}pre.code .cs{color:var(--code-str)}pre.code .cc{color:var(--code-com);font-style:italic}pre.code .cn{color:var(--code-num)}
.nav2{display:flex;gap:6px;margin:8px 0}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px;cursor:pointer;font-size:12.5px}
.nav2 button:disabled{opacity:.4;cursor:default}
.nav2 button:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
ul.dec{padding-left:0;list-style:none;margin:4px 0}
ul.dec li{font-size:12.5px;padding:3px 0 3px 14px;position:relative}
ul.dec li::before{content:"→";position:absolute;left:0;color:var(--faint)}
ul.dec li a{cursor:pointer;text-decoration:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--faint)}.kv dd{margin:0}
/* erd */
.tbl{width:100%;height:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);font-size:11px}
.tbl .th{padding:5px 9px;font:600 12px var(--mono);color:#fff;background:var(--gc);display:flex;justify-content:space-between;align-items:center}
.tbl .th span{font:500 9.5px var(--font);opacity:.85}
.tbl .tr{display:flex;gap:6px;padding:1px 9px;height:19px;align-items:center;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
.tbl .tr .f{font-family:var(--mono);font-size:10.5px;flex:1;overflow:hidden;text-overflow:ellipsis}
.tbl .tr .ty{color:var(--faint);font-size:10px;font-family:var(--mono);max-width:96px;overflow:hidden;text-overflow:ellipsis}
.tbl .tr .fl{font:700 8px var(--mono);border-radius:3px;padding:0 3px;color:var(--gc);border:1px solid color-mix(in srgb,var(--gc) 50%,transparent)}
.tbl.redis{border-style:dashed}
.g-line{--gc:var(--g-line)}.g-know{--gc:var(--g-know)}.g-prod{--gc:var(--g-prod)}.g-bill{--gc:var(--g-bill)}.g-id{--gc:var(--g-id)}.g-redis{--gc:var(--g-redis)}
.rel path{fill:none;stroke:var(--edge);stroke-width:1.3;opacity:.7}
.rel.soft path{stroke-dasharray:5 4}
.rel.hot path{stroke:var(--accent);stroke-width:2.4;opacity:1}
svg.has-ev .rel:not(.hot) path{opacity:.08}
svg.has-ev .gtbl:not(.on){opacity:.25}
.gtbl{cursor:pointer;transition:opacity .15s}
.gtbl.sel .tbl{box-shadow:0 0 0 3px var(--accent)}
.relmark{fill:none;stroke:context-stroke}
.fieldlist{width:100%;border-collapse:collapse;font-size:12px}
.fieldlist td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.fieldlist td:first-child{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.fieldlist td.ty{color:var(--faint);font-family:var(--mono);font-size:11px}
/* findings */
#findings{flex:1;overflow:auto;padding:22px max(16px,4vw) 80px;background:var(--bg);border:0;outline:0}
#findings .wrap{max-width:1100px;margin:0 auto}
#findings h2{font-size:22px;margin:0 0 6px;font-weight:600}
#findings .lead{color:var(--muted);max-width:820px}
.fsum{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.fsum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.fsum b{display:block;font-size:20px;color:var(--ink)}
.fcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:10px;padding:14px 18px;margin:12px 0;box-shadow:var(--shadow)}
.fcard h3{margin:0 0 4px;font-size:15.5px;font-weight:600;line-height:1.4}
.fcard .fh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.sev{font:700 10.5px var(--mono);color:#fff;background:var(--sc);border-radius:5px;padding:1px 7px}
.s-high{--sc:var(--o-error)}.s-med{--sc:var(--o-handoff)}.s-low{--sc:var(--k-svc)}.s-good{--sc:var(--o-reply)}
.fcard dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:8px 0 0;font-size:13.5px}
.fcard dt{color:var(--faint);font-size:12.5px}
.fcard dd{margin:0}
.fcard .loc code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
.refs{font-size:12.5px;color:var(--muted)}
#findings ol.gl{padding-left:20px;margin:6px 0}#findings ol.gl li{margin:4px 0;font-size:13.5px}
#findings ul{padding-left:20px;font-size:13.5px}#findings ul li{margin:4px 0}
#findings .fcard p{font-size:13.5px}
table.gt{margin:8px 0}table.gt th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
#findings .fcard{overflow-x:auto}
[hidden]{display:none!important}
@media (max-width:1180px){
  main#app{grid-template-columns:230px minmax(0,1fr);grid-template-rows:minmax(420px,62vh) auto;height:auto}
  aside#panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:760px){
  header.top,nav.views{padding-left:16px;padding-right:16px}
  main#app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
  aside#events{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}
  .fcard dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <h1>Product flow · preset/meta, catalog, stock, index, RAG &amp; ERD</h1>
  <div class="meta">chatbot-agents · อ่านจาก working tree บน <code>main</code> (HEAD 6c7bc8d + ไฟล์ที่ยังไม่ commit) · 22 ต.ค. 2026 · เฉพาะ feature product (ECOMMERCE preset) · ตัวอย่างข้อมูลเป็นข้อมูลสมมติ</div>
  <button class="iconbtn" id="themeBtn" type="button" title="สลับธีม">◐ ธีม</button>
</header>
<nav class="views" id="views" role="tablist"></nav>
<main id="app">
  <aside id="events" aria-label="Events"></aside>
  <section id="stage">
    <div class="toolbar">
      <button type="button" id="fitBtn">พอดีจอ</button>
      <button type="button" id="zinBtn" aria-label="ซูมเข้า">+</button>
      <button type="button" id="zoutBtn" aria-label="ซูมออก">-</button>
      <button type="button" id="clearBtn">ล้างที่เลือก</button>
    </div>
    <div class="hint">ลากเพื่อเลื่อน · scroll เพื่อซูม · ← → เดินทีละขั้น</div>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>
<section id="findings" hidden></section>
<div id="diag" hidden></div>
<script>
'use strict';
/* ===================== data helpers ===================== */
const q = (s) => JSON.stringify(s);
const N = (id, x, y, k, title, s, o = {}) => ({ id, x, y, k, title, s, ...o });
const E = (from, to, label = '', o = {}) => ({ from, to, label, ...o });
const SRC = 'src/modules/';
const P = SRC + 'products/';
const KP = SRC + 'chatbot/knowledge/product/';

/* ===================== app ===================== */
const CW = 200, CH = 112, NW = 172, NH = 64, PAD = 70;
const KIND = { start: 'จุดเริ่ม', svc: 'service', dec: 'จุดตัดสินใจ', llm: 'AI / LLM call', ext: 'external API', end: 'ปลายทาง' };
const OUTC = { reply: 'ตอบลูกค้า', handoff: 'fallback + แจ้งแอดมิน', silent: 'ไม่ตอบ / ทิ้ง', error: 'error · retry · ตรวจมือ', ask: 'ถามกลับ', pass: 'ต่อที่ flow อื่น' };
const SEV = { high: 'สูง', med: 'กลาง', low: 'ต่ำ' };
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);

};
const svg = $('#svg');
const state = { view: VIEWS[0].id, event: null, node: null, step: -1, erdFlow: null };
let G = null;
let vb = { x: 0, y: 0, w: 1000, h: 800 };

/* ---------- code highlighting for data shapes ---------- */
const escText = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
/** Splits a line at the first // that is not inside a quoted string. */
function splitComment(line) {
  let quote = null;
  for (let i = 0; i < line.length - 1; i++) {
    const c = line[i];
    if (quote) { if (c === '\\') i++; else if (c === quote) quote = null; continue; }
    if (c === "'" || c === '"') quote = c;
    else if (c === '/' && line[i + 1] === '/' && line[i - 1] !== ':') return [line.slice(0, i), line.slice(i)];
  }
  return [line, ''];
}
function hl(text) {
  return String(text ?? '').split('\n').map((line) => {
    const [code, comment] = splitComment(line);
    const out = escText(code).replace(/('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d[\d.,]*\b)|([A-Za-z_$][\w$.]*)(?=\s*:(?!\/))/g,
      (m, s, n, k) => s ? `<span class="cs">${s}</span>` : n ? `<span class="cn">${n}</span>` : `<span class="ck">${k}</span>`);
    return out + (comment ? `<span class="cc">${escText(comment)}</span>` : '');
  }).join('\n');
}
const pre = (t) => `<pre class="code">${hl(t)}</pre>`;
const fileLink = (f) => {
  if (!f) return '';
  const [path, line] = f.split(':');
  return `<a href="../${esc(path)}" title="เปิดไฟล์ (relative จาก docs/)"><code>${esc(path)}${line ? ':' + esc(line) : ''}</code></a>`;
};

/* ---------- prepare flow views ---------- */
function prep(v) {
  if (v._prep) return v;
  v.nodeMap = new Map(v.nodes.map((n) => [n.id, n]));
  v.edgeMap = new Map();
  for (const e of v.edges) { e.id = `${e.from}>${e.to}`; v.edgeMap.set(e.id, e); }
  v.problems = [];
  for (const ev of v.events) {
    ev.p.forEach(([id], i) => {
      if (!v.nodeMap.has(id)) v.problems.push(`${ev.id}: ไม่มี node ${id}`);
      if (i === 0) return;
      const key = `${ev.p[i - 1][0]}>${id}`;
      if (!v.edgeMap.has(key)) {
        v.problems.push(`${ev.id}: ไม่มี edge ${key}`);
        const e = E(ev.p[i - 1][0], id, '', { soft: true });
        e.id = key; v.edges.push(e); v.edgeMap.set(key, e);
      }
    });
  }
  v.byNode = new Map();
  for (const ev of v.events) for (const [id] of ev.p) {
    if (!v.byNode.has(id)) v.byNode.set(id, []);
    if (!v.byNode.get(id).includes(ev)) v.byNode.get(id).push(ev);
  }
  layout(v);
  v._prep = true;
  return v;
}

function layout(v) {
  const minX = Math.min(...v.nodes.map((n) => n.x - (n.w ? n.w / 2 : 0.5)), ...v.edges.filter((e) => e.lane != null).map((e) => e.lane - 0.3));
  v.px = (x) => (x - minX) * CW + PAD + CW / 2;
  for (const n of v.nodes) {
    n.cx = v.px(n.x); n.cy = n.y * CH + PAD + NH / 2;
    n.ww = n.w ? n.w * CW - (CW - NW) : NW;
    n.l = n.cx - n.ww / 2; n.r = n.cx + n.ww / 2; n.t = n.cy - NH / 2; n.b = n.cy + NH / 2;
  }
  v.ranks = [...new Set(v.nodes.map((n) => n.y))].sort((a, b) => a - b);
  const lanes = v.edges.filter((e) => e.lane != null).map((e) => v.px(e.lane));
  v.W = Math.max(...v.nodes.map((n) => n.r), ...lanes) + PAD;
  v.H = Math.max(...v.nodes.map((n) => n.b)) + PAD;
  // spread anchors of down edges so fan-out/fan-in stays readable
  for (const n of v.nodes) {
    const outs = v.edges.filter((e) => e.from === n.id && e.lane == null && v.nodeMap.get(e.to)?.y > n.y)
      .sort((a, b) => v.nodeMap.get(a.to).cx - v.nodeMap.get(b.to).cx);
    const ins = v.edges.filter((e) => e.to === n.id && e.lane == null && v.nodeMap.get(e.from)?.y < n.y)
      .sort((a, b) => v.nodeMap.get(a.from).cx - v.nodeMap.get(b.from).cx);
    const spread = (list, key) => {
      const k = list.length; const gap = k > 1 ? Math.min(20, (n.ww - 36) / (k - 1)) : 0;
      list.forEach((e, i) => { e[key] = n.cx + (i - (k - 1) / 2) * gap; });
    };
    spread(outs, 'sx');
    if (!n.bus) spread(ins, 'tx');
  }
  for (const e of v.edges) routeEdge(v, e);
}

function freeX(v, rank, desired) {
  const iv = v.nodes.filter((n) => n.y === rank).map((n) => [n.l - 9, n.r + 9]);
  let x = desired;
  for (let guard = 0; guard < 6; guard++) {
    const hit = iv.find(([a, b]) => x > a && x < b);
    if (!hit) return x;
    x = Math.abs(x - hit[0]) <= Math.abs(hit[1] - x) ? hit[0] - 1 : hit[1] + 1;
  }
  return x;
}

function routeEdge(v, e) {
  const s = v.nodeMap.get(e.from), t = v.nodeMap.get(e.to);
  if (!s || !t) { e.d = ''; return; }
  if (e.lane != null) {
    const lx = v.px(e.lane), right = lx > s.cx;
    const p = [[right ? s.r : s.l, s.cy], [lx, s.cy], [lx, t.cy], [right ? t.r : t.l, t.cy]];
    e.d = orthoD(p); return;
  }
  if (t.y === s.y) {
    const dir = t.cx > s.cx ? 1 : -1;
    const blocked = v.nodes.some((n) => n.y === s.y && n !== s && n !== t && (n.cx - s.cx) * dir > 0 && (t.cx - n.cx) * dir > 0);
    if (!blocked) { e.d = `M${dir > 0 ? s.r : s.l},${s.cy} L${dir > 0 ? t.l : t.r},${t.cy}`; return; }
    const ry = s.t - 22, sx = s.cx + dir * 30, tx = t.cx - dir * 30;
    e.d = orthoD([[sx, s.t], [sx, ry], [tx, ry], [tx, t.t]]); return;
  }
  if (t.y < s.y) { // upward: go around on the right
    const lx = Math.max(s.r, t.r) + 40;
    e.d = orthoD([[s.r, s.cy], [lx, s.cy], [lx, t.cy], [t.r, t.cy]]); return;
  }
  const sx = e.sx ?? s.cx;
  const goal = t.bus ? Math.min(Math.max(sx, t.l + 18), t.r - 18) : (e.tx ?? t.cx);
  const pts = [[sx, s.b]];
  const mids = v.ranks.filter((r) => r > s.y && r < t.y);
  mids.forEach((r) => {
    const f = (r - s.y) / (t.y - s.y);
    const x = freeX(v, r, sx + (goal - sx) * f);
    const cy = r * CH + PAD + NH / 2;
    pts.push([x, cy - NH / 2 - 10], [x, cy + NH / 2 + 10]);
  });
  const last = pts[pts.length - 1][0];
  const tx = t.bus ? Math.min(Math.max(last, t.l + 18), t.r - 18) : goal;
  pts.push([tx, t.t]);
  e.d = curveD(pts);
}
function curveD(p) {
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 1; i < p.length; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i];
    if (Math.abs(x1 - x0) < 0.5) d += ` L${x1.toFixed(1)},${y1.toFixed(1)}`;
    else { const dy = (y1 - y0) * 0.5; d += ` C${x0.toFixed(1)},${(y0 + dy).toFixed(1)} ${x1.toFixed(1)},${(y1 - dy).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`; }
  }
  return d;

function orthoD(p, r = 12) {

/* ---------- ERD ---------- */
function prepErd(v) {

  const TW = 236, GAPX = 52, ROW = 19, HEAD = 28;
  v.columns.forEach((col, ci) => {
    let y = PAD;
    for (const id of col) {
      const t = v.tableMap.get(id);
      t.x = PAD + ci * (TW + GAPX); t.y = y; t.w = TW; t.h = HEAD + t.fields.length * ROW + 6; t.ci = ci;
      y += t.h + 30;

    const i = t.fields.findIndex((f) => f[0] === field || f[0].startsWith(field.split(' ')[0]));
    return i < 0 ? t.y + 14 : t.y + HEAD + i * ROW + ROW / 2;
  };

  v.relList = v.rels.map(([a, af, b, bf, card = 'n1', soft = false], i) => {
    const s = v.tableMap.get(a), t = v.tableMap.get(b);

    let x1, x2, d, d1, d2;

      const k = (loops.get(s.ci) || 0) + 1; loops.set(s.ci, k);
      x1 = s.x + s.w; x2 = t.x + t.w; const lx = x1 + 14 + (k % 4) * 7;
      d = `M${x1},${y1} C${lx + 20},${y1} ${lx + 20},${y2} ${x2},${y2}`; d1 = 1; d2 = 1;
    } else {

      const dx = Math.max(40, Math.abs(x2 - x1) / 2);
      d = `M${x1},${y1} C${x1 + (right ? dx : -dx)},${y1} ${x2 + (right ? -dx : dx)},${y2} ${x2},${y2}`;
      d1 = right ? 1 : -1; d2 = right ? -1 : 1;

    ${ev.note ? `<div class="note">${esc(ev.note)}</div>` : ''}${ev.risk ? `<div class="note risk">⚠ ${esc(ev.risk)}</div>` : ''}
    <h3>เส้นทาง · คลิกเพื่อดู data shape</h3>
    <ol class="steps">${ev.p.map(([id], i) => {
      const n = v.nodeMap.get(id); const nx = ev.p[i + 1]; const e = nx && v.edgeMap.get(`${id}>${nx[0]}`);
      return `<li data-i="${i}" class="${i === state.step ? 'cur' : ''}">${esc(n?.title || id)}${e?.label ? `<span class="via">→ ${esc(e.label)}</span>` : ''}</li>`;
    }).join('')}</ol>`;
}
function panelNode(v, n, ev) {
  let s = `<div class="chips"><span class="chip k k-${n.k === 'end' ? 'svc' : n.k}">${esc(KIND[n.k])}</span>${n.k === 'end' ? `<span class="chip o o-${n.oc}">● ${esc(OUTC[n.oc])}</span>` : ''}${n.tag ? `<span class="chip">${esc(n.tag)}</span>` : ''}</div>
    <h2>${esc(n.title)}</h2><p class="sub">${esc(n.s)}</p>${n.f ? `<p>${fileLink(n.f)}</p>` : ''}${n.d ? `<p>${esc(n.d)}</p>` : ''}`;
  if (ev) {
    const i = state.step >= 0 && ev.p[state.step]?.[0] === n.id ? state.step : ev.p.findIndex(([x]) => x === n.id);
    if (i >= 0) {
      const prev = ev.p[i - 1], next = ev.p[i + 1];
      const pe = prev && v.edgeMap.get(`${prev[0]}>${n.id}`), ne = next && v.edgeMap.get(`${n.id}>${next[0]}`);
      s += `<h3>ใน event “${esc(ev.t)}” · ขั้น ${i + 1}/${ev.p.length}</h3>
        <div class="nav2"><button type="button" data-step="-1" ${i ? '' : 'disabled'}>← ${esc(prev ? v.nodeMap.get(prev[0])?.title : 'ก่อนหน้า')}</button><button type="button" data-step="1" ${next ? '' : 'disabled'}>${esc(next ? v.nodeMap.get(next[0])?.title : 'ถัดไป')} →</button></div>
        <div class="io"><div class="h"><span>เข้า${prev ? ` จาก <b>${esc(v.nodeMap.get(prev[0])?.title)}</b>` : ''}</span><span>${esc(pe?.label || '')}</span></div>${pre(prev ? prev[1] : ev.ex)}</div>
        <div class="io"><div class="h"><span>${next ? `ออก ไป <b>${esc(v.nodeMap.get(next[0])?.title)}</b>` : '<b>จบ event</b>'}</span><span>${esc(ne?.label || '')}</span></div>${pre(ev.p[i][1])}</div>`;
    } else s += `<div class="note">กล่องนี้ไม่อยู่ในเส้นทางของ event ที่เลือก</div>`;
  }
  const outs = v.edges.filter((e) => e.from === n.id);
  if (outs.length) s += `<h3>ทางออกที่เป็นไปได้ (${outs.length})</h3><ul class="dec">${outs.map((e) => `<li><a data-n="${e.to}">${esc(e.label || 'ต่อไป')} → ${esc(v.nodeMap.get(e.to)?.title)}</a></li>`).join('')}</ul>`;
  const ins = v.edges.filter((e) => e.to === n.id);
  if (ins.length) s += `<h3>เข้ามาจาก</h3><ul class="dec">${ins.map((e) => `<li><a data-n="${e.from}">${esc(v.nodeMap.get(e.from)?.title)}${e.label ? ` · ${esc(e.label)}` : ''}</a></li>`).join('')}</ul>`;
  if (n.i) s += `<h3>Shape เข้า (ทั่วไป)</h3>${pre(n.i)}`;
  if (n.out) s += `<h3>Shape ออก (ทั่วไป)</h3>${pre(n.out)}`;
  if (n.db) s += `<h3>DB / Redis / billing</h3><p class="sub">${esc(n.db)}</p>`;
  const evs = v.byNode.get(n.id) || [];
  if (evs.length) s += `<h3>Events ที่ผ่านกล่องนี้ (${evs.length})</h3><div class="chips">${evs.map((x) => `<button type="button" class="chip btn o-${x.oc}" data-e="${x.id}"><span class="dot"></span>${esc(x.t)}</button>`).join('')}</div>`;
  return s;
}
function panelTable(v, t) {
  const rels = v.relList.filter((r) => r.a === t.id || r.b === t.id);
  return `<div class="chips"><span class="chip g-${t.g}" style="color:var(--gc)">${esc(v.groups[t.g])}</span></div><h2 class="mono">${esc(t.label)}</h2>${t.note ? `<p class="sub">${esc(t.note)}</p>` : ''}
    <h3>คอลัมน์ที่เกี่ยวกับ core logic</h3><table class="fieldlist">${t.fields.map(([f, ty, fl]) => `<tr><td>${esc(f)}</td><td class="ty">${esc(ty || '')}</td><td>${fl ? `<span class="chip">${esc(fl)}</span>` : ''}</td></tr>`).join('')}</table>
    <h3>เขียนโดย</h3><p class="sub">${esc(t.wr)}</p><h3>อ่านโดย</h3><p class="sub">${esc(t.rd)}</p>
    <h3>ใช้ใน flow</h3><div class="chips">${(t.flows || []).map((f) => `<button type="button" class="chip btn" data-goto="${f}">${esc(v.flows.find(([id]) => id === f)?.[1] || f)}</button>`).join('')}</div>
    <h3>ความสัมพันธ์ (${rels.length})</h3><ul class="dec">${rels.map((r) => `<li><a data-t="${r.a === t.id ? r.b : r.a}"><code>${esc(r.a)}.${esc(r.af)}</code> → <code>${esc(r.b)}.${esc(r.bf)}</code> · ${r.card === '11' ? '1:1' : 'N:1'}${r.soft ? ' · ไม่มี FK' : ''}</a></li>`).join('')}</ul>`;
}
function renderPanel() {
  const v = view(), box = $('#panel');
  if (v.tables) {
    const t = state.node && v.tableMap.get(state.node);
    box.innerHTML = t ? panelTable(v, t) : panelIntro(v) + (state.erdFlow ? `<div class="note">ไฮไลต์ตาราง ${v.tables.filter((x) => x.flows?.includes(state.erdFlow)).length} รายการที่ ${esc(v.flows.find(([id]) => id === state.erdFlow)[1])} ใช้</div>` : '');
  } else {
    const ev = state.event && v.events.find((x) => x.id === state.event);
    const n = state.node && v.nodeMap.get(state.node);
    box.innerHTML = n ? panelNode(v, n, ev) + (ev ? `<h3>Event ที่เลือก</h3>${panelEvent(v, ev)}` : '') : ev ? panelEvent(v, ev) : panelIntro(v);
  }
  box.querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => stepBy(Number(b.dataset.step))));
  box.querySelectorAll('ol.steps li').forEach((li) => (li.onclick = () => { const ev = view().events.find((x) => x.id === state.event); const i = Number(li.dataset.i); selectNode(ev.p[i][0], i, true); }));
  box.querySelectorAll('[data-n]').forEach((a) => (a.onclick = () => selectNode(a.dataset.n, undefined, true)));
  box.querySelectorAll('[data-e]').forEach((b) => (b.onclick = () => selectEvent(b.dataset.e)));
  box.querySelectorAll('[data-t]').forEach((a) => (a.onclick = () => { state.node = a.dataset.t; syncAll(); focusTables(a.dataset.t); }));
  box.querySelectorAll('[data-goto]').forEach((b) => (b.onclick = () => switchView(b.dataset.goto)));
}

/* ---------- findings ---------- */
function renderFindings() {
  $('#findings').innerHTML = guideHtml();
}

/* ---------- orchestration ---------- */
function switchView(id) {
  if (!VIEWS.some((v) => v.id === id)) id = VIEWS[0].id;
  state.view = id; state.event = null; state.node = null; state.step = -1; state.erdFlow = null; filterText = '';
  const v = view();
  $('#app').hidden = !!v.findings;
  $('#findings').hidden = !v.findings;
  renderTabs();
  if (v.findings) { renderFindings(); writeHash(); return; }
  if (v.tables) renderErd(v); else renderFlow(v);
  legend();
  syncAll();
  fitAll();
}
function syncAll() {
  const v = view();
  if (v.findings) return;
  renderEvents(); renderPanel(); highlight(); writeHash();
}
function writeHash() {
  const h = '#' + [state.view, state.event, state.node].map((x) => x || '').join('/').replace(/\/+$/, '');
  if (location.hash !== h) history.replaceState(null, '', h);
}
function readHash() {
  const [vid, eid, nid] = decodeURIComponent(location.hash.slice(1)).split('/');
  switchView(vid || VIEWS[0].id);
  const v = view();
  if (eid && v.events?.some((x) => x.id === eid)) selectEvent(eid);
  if (nid && (v.nodeMap?.has(nid) || v.tableMap?.has(nid))) { if (v.tables) { state.node = nid; syncAll(); focusTables(nid); } else selectNode(nid, undefined, true); }
}
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('core-logic-theme', document.documentElement.dataset.theme); } catch {}
};
try { const t = localStorage.getItem('core-logic-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
window.addEventListener('resize', () => { if (!view().findings) fitAll(); });
for (const v of VIEWS.filter((x) => x.nodes)) prep(v);
$('#diag').textContent = JSON.stringify(Object.fromEntries(VIEWS.filter((x) => x.nodes).map((v) => [v.id, v.problems])));
readHash();
</script>
</body>
</html>
